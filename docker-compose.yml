version: '3.8'

services:
  # 1. 钱包核心微服务 (Python FastAPI + Async SQLAlchemy)
  wallet-service:
    build:
      context: ./wallet_service
      dockerfile: Dockerfile
    container_name: poker-wallet-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql+asyncpg://poker_admin:PokerDB2024@postgres:5432/poker_platform
      - COMMISSION_SERVICE_URL=http://commission-service:8000
      - WALLET_INTERNAL_KEY=change-me-in-prod
    restart: unless-stopped
    networks:
      - poker_net

  # 2. 结算与返佣微服务 (Python FastAPI)
  commission-service:
    build:
      context: ./commission_service
      dockerfile: Dockerfile
    container_name: poker-commission-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://poker_admin:PokerDB2024@postgres:5432/poker_platform
    restart: unless-stopped
    networks:
      - poker_net

  # 3. BFF 聚合层 (Node.js + Hono)
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: poker-bff
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - WALLET_SERVICE_URL=http://wallet-service:8001
      - COMMISSION_SERVICE_URL=http://commission-service:8000
      - GAME_ENGINE_URL=http://game-engine:8003
    depends_on:
      - wallet-service
      - commission-service
    restart: unless-stopped
    networks:
      - poker_net

  # 4. 多游戏引擎 (Node.js + Hono + WebSocket)
  game-engine:
    build:
      context: ./game-engine
      dockerfile: Dockerfile
    container_name: poker-game-engine
    ports:
      - "8003:8003"
    environment:
      - ENGINE_PORT=8003
      - WALLET_SERVICE_URL=http://wallet-service:8001
      - DATABASE_URL=postgresql://poker_admin:PokerDB2024@postgres:5432/poker_platform
      - DISCONNECT_TIMEOUT_MS=300000
    depends_on:
      - wallet-service
    restart: unless-stopped
    networks:
      - poker_net

  # 5. 代理端后台 (React + Vite + Nginx)
  agent-dashboard:
    build:
      context: ./agent-dashboard
      dockerfile: Dockerfile
    container_name: poker-agent-dashboard
    ports:
      - "8089:80"
    networks:
      - poker_net

  # 6. 客服端后台 (React + Vite + Nginx)
  support-dashboard:
    build:
      context: ./support-dashboard
      dockerfile: Dockerfile
    container_name: poker-support-dashboard
    ports:
      - "8090:80"
    networks:
      - poker_net

  # 7. 管理端后台 (React + Vite + Nginx)
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: poker-admin-dashboard
    ports:
      - "8088:80"
    networks:
      - poker_net

  # 8. Metabase 数据 BI 监控
  metabase:
    image: metabase/metabase:latest
    container_name: poker-metabase
    ports:
      - "3030:3000"
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped
    networks:
      - poker_net

volumes:
  wallet_data:
  commission_data:
  metabase_data:

networks:
  poker_net:
    driver: bridge
