<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>V-POKER · 大厅</title>
	<link rel="stylesheet" href="assets/design.css">
</head>

<body>
	<div class="app" data-design-id="hall-page">
		<header class="topbar" data-design-id="hall-topbar">
			<div class="brand" data-design-id="hall-brand">V-POKER <small>棋牌竞技</small></div>
			<div class="notice" data-design-id="hall-notice">
				<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
					<path d="M12 2a7 7 0 0 0-7 7v4l-2 3h18l-2-3V9a7 7 0 0 0-7-7Zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3Z" />
				</svg>
				<span>欢迎来到 V-POKER · 房间由服务端权威结算，前端不参与分账</span>
			</div>
			<button type="button" class="who" data-design-id="hall-user">
				<span class="avatar" data-design-id="hall-user-avatar">A</span>
				<span class="who-meta">
					<span class="who-name" data-design-id="hall-user-name">player_alice</span>
					<span class="who-coin num" data-design-id="hall-user-coin">筹码 12,340</span>
				</span>
			</button>
		</header>

		<div class="body">
			<nav class="rail" data-design-id="hall-rail" aria-label="主导航">
				<button type="button" class="rail-item is-active" data-design-id="nav-hall" aria-current="page">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
						<rect x="3" y="3" width="7" height="7" rx="1.5" />
						<rect x="14" y="3" width="7" height="7" rx="1.5" />
						<rect x="3" y="14" width="7" height="7" rx="1.5" />
						<rect x="14" y="14" width="7" height="7" rx="1.5" />
					</svg>
					<span>大厅</span>
				</button>
				<button type="button" class="rail-item" data-design-id="nav-wallet">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
						<rect x="3" y="6" width="18" height="13" rx="2.5" />
						<path d="M3 10h18" />
						<circle cx="17" cy="14.5" r="1.2" fill="currentColor" stroke="none" />
					</svg>
					<span>钱包</span>
				</button>
				<button type="button" class="rail-item" data-design-id="nav-profile">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
						<circle cx="12" cy="8.5" r="3.5" />
						<path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
					</svg>
					<span>我的</span>
				</button>
			</nav>

			<main class="main" data-design-id="hall-main">
				<div class="panel-head">
					<h2 class="panel-title" data-design-id="hall-games-title">选择玩法</h2>
					<span class="section-title" data-design-id="hall-games-note">对齐后端 4 种玩法 · 现金局</span>
				</div>

				<div class="games" data-design-id="hall-games">
					<button type="button" class="game" data-design-id="game-texas">
						<span class="game-top">
							<span class="game-suit is-black" aria-hidden="true">
								<svg viewBox="0 0 24 24"><path d="M12 2c2.6 3.2 7 6.3 7 10.2A4.3 4.3 0 0 1 12 15a4.3 4.3 0 0 1-7-2.8C5 8.3 9.4 5.2 12 2Zm-1.4 12.6h2.8L12 22l-1.4-7.4Z" /></svg>
							</span>
							<span class="badge badge-wait" data-design-id="game-texas-state">可加入</span>
						</span>
						<span class="game-name" data-design-id="game-texas-name">德州扑克</span>
						<span class="game-meta"><span class="num">底分 100</span><span>2–6 人</span></span>
						<span class="game-foot">
							<span class="section-title">texas_holdem</span>
							<span class="game-enter">进入
								<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
							</span>
						</span>
					</button>

					<button type="button" class="game" data-design-id="game-zhajinhua">
						<span class="game-top">
							<span class="game-suit is-red" aria-hidden="true">
								<svg viewBox="0 0 24 24"><path d="M12 21S3.5 15.4 3.5 9.6A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.5 2.4C20.5 15.4 12 21 12 21Z" /></svg>
							</span>
							<span class="badge badge-wait" data-design-id="game-zhajinhua-state">可加入</span>
						</span>
						<span class="game-name" data-design-id="game-zhajinhua-name">炸金花</span>
						<span class="game-meta"><span class="num">底分 50</span><span>2–5 人</span></span>
						<span class="game-foot">
							<span class="section-title">zha_jin_hua</span>
							<span class="game-enter">进入
								<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
							</span>
						</span>
					</button>

					<button type="button" class="game" data-design-id="game-niuniu">
						<span class="game-top">
							<span class="game-suit is-black" aria-hidden="true">
								<svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 3.2 6.4 4 4 0 1 1-1.2 7.7V20h-4v-3.9A4 4 0 1 1 8.8 8.4 4 4 0 0 1 12 2Z" /></svg>
							</span>
							<span class="badge badge-wait" data-design-id="game-niuniu-state">可加入</span>
						</span>
						<span class="game-name" data-design-id="game-niuniu-name">抢庄牛牛</span>
						<span class="game-meta"><span class="num">底分 100</span><span>2–6 人</span></span>
						<span class="game-foot">
							<span class="section-title">niu_niu</span>
							<span class="game-enter">进入
								<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
							</span>
						</span>
					</button>

					<button type="button" class="game" data-design-id="game-sangong">
						<span class="game-top">
							<span class="game-suit is-red" aria-hidden="true">
								<svg viewBox="0 0 24 24"><path d="M12 2.5 21 12l-9 9.5L3 12l9-9.5Z" /></svg>
							</span>
							<span class="badge badge-wait" data-design-id="game-sangong-state">可加入</span>
						</span>
						<span class="game-name" data-design-id="game-sangong-name">抢庄三公</span>
						<span class="game-meta"><span class="num">底分 100</span><span>2–6 人</span></span>
						<span class="game-foot">
							<span class="section-title">san_gong</span>
							<span class="game-enter">进入
								<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
							</span>
						</span>
					</button>
				</div>

				<div class="panel" data-design-id="hall-quick">
					<div class="panel-head">
						<h3 class="panel-title" data-design-id="hall-quick-title">房间管理</h3>
						<span class="section-title">创建后可加入机器人陪练</span>
					</div>
					<div style="display:flex; gap:10px; flex-wrap:wrap;">
						<button type="button" class="btn btn-primary" data-design-id="hall-create-room">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
							创建房间
						</button>
						<button type="button" class="btn btn-secondary" data-design-id="hall-my-rooms">我的房间</button>
						<button type="button" class="btn btn-ghost" data-design-id="hall-agent-center">代理中心</button>
					</div>
				</div>
			</main>

			<aside class="aside" data-design-id="hall-aside">
				<div class="panel-head">
					<h3 class="panel-title" data-design-id="hall-join-title">快速加入</h3>
				</div>
				<div class="field" data-design-id="hall-join-room-field">
					<label for="join-room-id">房号</label>
					<input id="join-room-id" class="input num" inputmode="numeric" placeholder="6 位数字房号" data-design-id="hall-join-room-input">
				</div>
				<div class="field" data-design-id="hall-join-pwd-field">
					<label for="join-room-pwd">密码（选填）</label>
					<input id="join-room-pwd" class="input" type="password" placeholder="公开房可留空" data-design-id="hall-join-pwd-input">
				</div>
				<button type="button" class="btn btn-primary btn-block" data-design-id="hall-join-submit">加入房间</button>

				<div style="height:1px;background:var(--border);margin:4px 0;"></div>

				<div class="panel-head">
					<h3 class="panel-title" data-design-id="hall-recent-title">最近战绩</h3>
				</div>
				<div class="rows" data-design-id="hall-recent-rows">
					<div class="row" data-design-id="hall-recent-1">
						<div class="row-main">
							<span class="row-title">德州扑克 · 房 389236</span>
							<span class="row-sub num">2026-09-23 20:14 · 同花顺</span>
						</div>
						<span class="amount-in num">+5,000</span>
					</div>
					<div class="row" data-design-id="hall-recent-2">
						<div class="row-main">
							<span class="row-title">炸金花 · 房 401882</span>
							<span class="row-sub num">2026-09-23 19:02 · 对子</span>
						</div>
						<span class="amount-out num">-1,200</span>
					</div>
				</div>
			</aside>
		</div>
	</div>
</body>

</html>
